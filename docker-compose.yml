version: '3.8'

services:
  app:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    networks:
      - service-network
    depends_on:
      - database
      - rabbitmq
    restart: unless-stopped

  web-proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    networks:
      - service-network
    depends_on:
      - app
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - service-network
    restart: on-failure

  database:
    image: postgres:latest
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - service-network
    restart: on-failure

volumes:
  rabbitmq_data:
  postgres_data:


networks:
  service-network:
    name: service-network
    driver: bridge
